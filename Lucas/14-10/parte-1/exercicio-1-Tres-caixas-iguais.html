<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1 — Três caixas iguais</title>
    <style>
    /* Estilo da página. */
        body { font-family: Arial, sans-serif; }
        
        /* Esta regra afeta a div que é o pai. */
        .container { display: flex; gap: 12px; }
        
        /* Esta regra afeta as caixas filhas. */
        .caixa { flex: 1; background-color: #D6E8FF; padding: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa">1</div>
        <div class="caixa">2</div>
        <div class="caixa">3</div>
    </div>
</body>
</html>
