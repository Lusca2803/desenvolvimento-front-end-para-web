<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2 — Menu centralizado</title>
<style>
        /* Estilo da página. */
        body { font-family: Arial, sans-serif; }
        
        /* Esta regra afeta a div que é o pai. */
        .container { display: flex; gap: 10px; }
        
        /* Esta regra afeta as caixas filhas. */
        .caixa { background-color: #D6E8FF; padding: 15px; }
        .caixa:nth-child(2) { background-color: #D5F1DF; }
        .caixa:nth-child(3) { background-color: #FFE5C5; }
        
        .menu { display: flex; justify-content: center; gap: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa">Caixa 1</div>
        <div class="caixa">Caixa 2</div>
        <div class="caixa">Caixa 3</div>
    </div>

    <nav class="menu">
        <a href="#">Início</a>
        <a href="#">Cursos</a>
        <a href="#">Contato</a>
    </nav>
</body>
</html>
