<!doctype html>
<!-- Informa que o documento usa HTML5. -->
<html lang="pt-br">
<head>
    <!-- Permite o uso correto de acentos. -->
    <meta charset="utf-8">

    <!-- Adapta a página a celulares e tablets. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <!-- Texto exibido na guia do navegador. -->
    <title>Cardápio da casa</title>

    <!-- Conecta o arquivo CSS externo ao HTML. -->
    <link rel="stylesheet" href="formatacao.css">
</head>
    <!-- Caixa principal que receberá borda e espaçamento. -->
    <main class="cardapio">

        <!-- h1 e h2 serão formatados por uma lista de seletores. -->
        <h1 id="topo">Cardápio da casa</h1>
        <h2>Prato do dia</h2>

        <!-- O parágrafo usa duas classes separadas por espaço. -->
        <p class="destaque grande">
            Filé grelhado com arroz e legumes.
        </p>

        <p>Conheça também nossas massas e saladas.</p>

        <!-- A regra img tornará a imagem responsiva. -->
        <img src="tradicional.jpg"
             alt="Prato tradicional da casa">

        <!-- O link terá outra aparência quando receber :hover. -->
        <p><a href="#topo">Voltar ao título</a></p>
    </main>
</body>
</html>
