<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade</title>
    <style>
        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 5px;
            text-align: left;
        }
    </style>
</head>

<body>
    <h2>Desáfio 1 - Tabela Básica</h2>
    <p>Crie uma tabela simples com cabeçalho (th) para "Produto" e "Preço", e 3 linhas (tr) de dados com td. Adicione bordas usando border e border-collapse: collapse.</p>
    <table style="width:100%">
        <tr>
            <th>Produto</th>
            <th>Preço</th>
        </tr>
        <tr>
            <td>Caneta</td>
            <td>R$ 2,00</td>
        </tr>
        <tr>
            <td>Caderno</td>
            <td>R$ 8,50</td>
        </tr>
        <tr>
            <td>Mochila</td>
            <td>R$ 60,00</td>
        </tr>
    </table>
</body>

</html>
