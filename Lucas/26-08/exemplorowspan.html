<html>
<head>
<style>
table, th, td {
 border: 1px solid black;
 border-collapse: collapse;
}
th, td {
 padding: 5px;
 text-align: left; 
}
</style>
</head>
<body>
<h2>Célula que ocupa duas linhas</h2>
<p>Para fazer uma célula ocupar mais de uma linha, use o atributo rowspan.</p>
<table style="width:100%">
 <tr>
 <th>Name:</th>
 <td>Bill Gates</td>
 </tr>
 <tr>
 <th rowspan="2">Telephone:</th>
 <td>55577854</td>
 </tr>
 <tr>
 <td>55577855</td>
 </tr>
</table>
</body>
</html>
